name: Train and Deploy CC Underwriting API

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Login to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure ML extension
        run: az extension add --name ml --yes

      - name: Get MLflow tracking URI
        run: |
          MLFLOW_URI=$(az ml workspace show \
            --name ${{ secrets.AZURE_ML_WORKSPACE }} \
            --resource-group ${{ secrets.AZURE_ML_RESOURCE_GROUP }} \
            --query mlflow_tracking_uri -o tsv)
          echo "MLFLOW_TRACKING_URI=$MLFLOW_URI" >> $GITHUB_ENV

      - name: Train model
        run: python train.py

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: .
